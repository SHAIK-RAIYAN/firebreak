<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#151E2E"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1100" height="680" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1096" height="676" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">DIAGRAM A: FIREBREAK COMPLETE SYSTEM ARCHITECTURE</text>
  <text x="40" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">End-to-end communication boundaries between Web Console, Inngest, NitroStack MCP, Database, and Upstream Services</text>

  <!-- Left: Client / Trigger Plane -->
  <rect x="40" y="105" width="230" height="530" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="40" y="105" width="230" height="36" rx="10" fill="#1E293B"/>
  <text x="55" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">1. CLIENTS &amp; TRIGGERS</text>

  <rect x="55" y="155" width="200" height="75" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="68" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F1F5F9">Operator Web UI</text>
  <text x="68" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Next.js 16 • Tailwind v4</text>
  <text x="68" y="212" font-family="monospace" font-size="10" fill="#38BDF8">https://firebreak-pi.vercel.app</text>

  <rect x="55" y="245" width="200" height="75" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="68" y="268" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#A855F7">MCP AI Clients</text>
  <text x="68" y="286" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Claude • ChatGPT • Studio</text>
  <text x="68" y="302" font-family="monospace" font-size="10" fill="#C084FC">STDIO &amp; HTTP SSE Transports</text>

  <rect x="55" y="335" width="200" height="75" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="68" y="358" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FB923C">Webhook Sources</text>
  <text x="68" y="376" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Datadog • Sentry • Probes</text>
  <text x="68" y="392" font-family="monospace" font-size="10" fill="#FDBA74">HMAC SHA-256 Signed Alerts</text>

  <rect x="55" y="425" width="200" height="85" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="68" y="448" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34D399">GitHub App Events</text>
  <text x="68" y="466" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Push • Deploy Status • PR</text>
  <text x="68" y="482" font-family="monospace" font-size="10" fill="#6EE7B7">x-hub-signature-256</text>
  <text x="68" y="497" font-family="monospace" font-size="10" fill="#94A3B8">Auto-deduplicated webhooks</text>

  <!-- Middle: Firebreak Compute Core -->
  <rect x="300" y="105" width="480" height="530" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="300" y="105" width="480" height="36" rx="10" fill="#1E293B"/>
  <text x="315" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">2. FIREBREAK PLATFORM CORE (apps/web + apps/mcp + packages/core)</text>

  <!-- apps/web box -->
  <rect x="315" y="155" width="215" height="150" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="328" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">apps/web (Next.js 16)</text>
  <text x="328" y="196" font-family="monospace" font-size="10" fill="#94A3B8">• /api/v1/alerts/[id] Ingest</text>
  <text x="328" y="212" font-family="monospace" font-size="10" fill="#94A3B8">• /api/v1/actions/[id]/approve</text>
  <text x="328" y="228" font-family="monospace" font-size="10" fill="#94A3B8">• /api/v1/incidents/[id]</text>
  <text x="328" y="244" font-family="monospace" font-size="10" fill="#94A3B8">• Better Auth Session Guard</text>
  <text x="328" y="260" font-family="monospace" font-size="10" fill="#94A3B8">• Incident Room (Loop Rail)</text>
  <text x="328" y="276" font-family="monospace" font-size="10" fill="#94A3B8">• HoldToConfirm Approval UI</text>

  <!-- apps/mcp box -->
  <rect x="545" y="155" width="220" height="150" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1.2"/>
  <text x="558" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#818CF8">apps/mcp (NitroStack)</text>
  <text x="558" y="196" font-family="monospace" font-size="10" fill="#94A3B8">• 9 Registered MCP Tools</text>
  <text x="558" y="212" font-family="monospace" font-size="10" fill="#94A3B8">• 3 React MCP Widgets</text>
  <text x="558" y="228" font-family="monospace" font-size="10" fill="#94A3B8">• McpKeyGuard (Token Hash)</text>
  <text x="558" y="244" font-family="monospace" font-size="10" fill="#94A3B8">• Universal Dual Transport</text>
  <text x="558" y="260" font-family="monospace" font-size="10" fill="#94A3B8">• Rate Limiter (60 req/min)</text>
  <text x="558" y="276" font-family="monospace" font-size="10" fill="#94A3B8">• NitroStudio &amp; NitroCloud</text>

  <!-- Inngest Workflow Orchestration -->
  <rect x="315" y="320" width="450" height="110" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="328" y="342" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F59E0B">Inngest Asynchronous Engine (apps/web/src/inngest)</text>
  <text x="328" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#F1F5F9">• Step 1: Alert deduplication &amp; incident triage pipeline (pipeline.ts)</text>
  <text x="328" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#F1F5F9">• Step 2: Action execution (actions.ts) ➔ Vercel Promote / Rollback</text>
  <text x="328" y="398" font-family="system-ui, sans-serif" font-size="11" fill="#F1F5F9">• Step 3: Canary Streak Health Probes (18 probes @ 10s interval, streak &gt;= 3)</text>
  <text x="328" y="416" font-family="system-ui, sans-serif" font-size="11" fill="#F1F5F9">• Step 4: AI root-cause blame explanation (analysis.ts) with graceful skip</text>

  <!-- packages/core Domain Engine -->
  <rect x="315" y="445" width="450" height="175" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="328" y="468" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10B981">packages/core (Shared Domain Services &amp; Adapters)</text>
  <text x="328" y="490" font-family="monospace" font-size="11" fill="#E2E8F0">Services:</text>
  <text x="390" y="490" font-family="monospace" font-size="10" fill="#94A3B8">incidents.ts • actions.ts • preflight.ts • ranking.ts • ssrf.ts</text>
  <text x="328" y="508" font-family="monospace" font-size="11" fill="#E2E8F0">Scoring Engine:</text>
  <text x="430" y="508" font-family="monospace" font-size="10" fill="#94A3B8">8-factor deterministic scoring (frame, symbol, hunk, recency)</text>
  <text x="328" y="526" font-family="monospace" font-size="11" fill="#E2E8F0">Preflight Gates:</text>
  <text x="430" y="526" font-family="monospace" font-size="10" fill="#94A3B8">6 blocking checks: target_ready, differs, not_known_bad, drift</text>
  <text x="328" y="544" font-family="monospace" font-size="11" fill="#E2E8F0">Crypto:</text>
  <text x="380" y="544" font-family="monospace" font-size="10" fill="#94A3B8">AES-256-GCM token encryption with dual-key rotation support</text>
  <text x="328" y="562" font-family="monospace" font-size="11" fill="#E2E8F0">Adapters:</text>
  <text x="395" y="562" font-family="monospace" font-size="10" fill="#94A3B8">vercelClient (promote fallback) • githubApp • aiProvider • resend</text>
  <text x="328" y="580" font-family="monospace" font-size="11" fill="#E2E8F0">Database:</text>
  <text x="395" y="580" font-family="monospace" font-size="10" fill="#94A3B8">Drizzle ORM + Neon serverless pooler (17 tables)</text>
  <text x="328" y="598" font-family="monospace" font-size="11" fill="#E2E8F0">Audit Trail:</text>
  <text x="410" y="598" font-family="monospace" font-size="10" fill="#94A3B8">Immutable timeline_events with actor badges (U, S, M, A)</text>

  <!-- Right: External Upstream Systems -->
  <rect x="810" y="105" width="250" height="530" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
  <rect x="810" y="105" width="250" height="36" rx="10" fill="#1E293B"/>
  <text x="825" y="129" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F43F5E">3. EXTERNAL SYSTEMS</text>

  <rect x="825" y="155" width="220" height="65" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="838" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Neon PostgreSQL</text>
  <text x="838" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Serverless DB • ep-tiny-cherry</text>
  <text x="838" y="210" font-family="monospace" font-size="10" fill="#38BDF8">SSL Mode • 17 Tables</text>

  <rect x="825" y="230" width="220" height="65" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="838" y="253" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Vercel Deployment API</text>
  <text x="838" y="271" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Deployments • Aliases • Jobs</text>
  <text x="838" y="285" font-family="monospace" font-size="10" fill="#34D399">v10 Promote Fallback (Hobby)</text>

  <rect x="825" y="305" width="220" height="65" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="838" y="328" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">GitHub REST &amp; App</text>
  <text x="838" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">App ID 5356622 • RSA JWT</text>
  <text x="838" y="360" font-family="monospace" font-size="10" fill="#A855F7">Commit comparison &amp; patches</text>

  <rect x="825" y="380" width="220" height="65" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="838" y="403" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">AI Inference Providers</text>
  <text x="838" y="421" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Google Gemini 2.5 Flash • OpenAI</text>
  <text x="838" y="435" font-family="monospace" font-size="10" fill="#F59E0B">Advisory JSON Root-Cause Card</text>

  <rect x="825" y="455" width="220" height="65" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="838" y="478" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Inngest Cloud</text>
  <text x="838" y="496" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Event delivery • Step retries</text>
  <text x="838" y="510" font-family="monospace" font-size="10" fill="#38BDF8">Idempotency &amp; probe sleeps</text>

  <rect x="825" y="530" width="220" height="65" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="838" y="553" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Resend Email Gateway</text>
  <text x="838" y="571" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Notifications &amp; On-Call Alert</text>
  <text x="838" y="585" font-family="monospace" font-size="10" fill="#F43F5E">Idempotent email deliveries</text>

