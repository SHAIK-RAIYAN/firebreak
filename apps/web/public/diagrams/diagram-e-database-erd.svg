<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="640" rx="14" fill="url(#bgE)"/>
  <rect x="2" y="2" width="1096" height="636" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">DIAGRAM E: DATABASE ENTITY-RELATIONSHIP ARCHITECTURE</text>
  <text x="40" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">PostgreSQL relational models, multi-tenant workspace partitioning, and foreign key boundaries (Drizzle ORM)</text>

  <!-- Table: workspaces -->
  <rect x="40" y="105" width="220" height="145" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="40" y="105" width="220" height="28" rx="6" fill="#38BDF8"/>
  <text x="50" y="124" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">workspaces (Tenants)</text>
  <text x="50" y="150" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (ws_...)</text>
  <text x="50" y="168" font-family="monospace" font-size="10" fill="#CBD5E1">   name, slug (UNIQUE)</text>
  <text x="50" y="186" font-family="monospace" font-size="10" fill="#CBD5E1">   created_at, updated_at</text>
  <text x="50" y="204" font-family="monospace" font-size="10" fill="#CBD5E1">   default_ai_provider</text>
  <text x="50" y="222" font-family="monospace" font-size="10" fill="#CBD5E1">   default_ai_model</text>

  <!-- Table: users & members -->
  <rect x="40" y="270" width="220" height="155" rx="6" fill="#1E293B" stroke="#64748B"/>
  <rect x="40" y="270" width="220" height="28" rx="6" fill="#334155"/>
  <text x="50" y="289" font-family="monospace" font-size="12" font-weight="700" fill="#F8FAFC">workspace_members</text>
  <text x="50" y="315" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (wsm_...)</text>
  <text x="50" y="333" font-family="monospace" font-size="10" fill="#CBD5E1">FK workspace_id ➔ workspaces</text>
  <text x="50" y="351" font-family="monospace" font-size="10" fill="#CBD5E1">FK user_id ➔ user (BetterAuth)</text>
  <text x="50" y="369" font-family="monospace" font-size="10" fill="#CBD5E1">   role (owner, admin, member)</text>
  <text x="50" y="387" font-family="monospace" font-size="10" fill="#CBD5E1">   UNIQUE(ws_id, user_id)</text>
  <text x="50" y="405" font-family="monospace" font-size="10" fill="#94A3B8">Sessions in session table</text>

  <!-- Table: services -->
  <rect x="300" y="105" width="240" height="210" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="300" y="105" width="240" height="28" rx="6" fill="#38BDF8"/>
  <text x="310" y="124" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">services (Protected Repos)</text>
  <text x="310" y="150" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (svc_...)</text>
  <text x="310" y="168" font-family="monospace" font-size="10" fill="#CBD5E1">FK workspace_id ➔ workspaces</text>
  <text x="310" y="186" font-family="monospace" font-size="10" fill="#CBD5E1">   name, slug</text>
  <text x="310" y="204" font-family="monospace" font-size="10" fill="#CBD5E1">   repo_owner, repo_name</text>
  <text x="310" y="222" font-family="monospace" font-size="10" fill="#CBD5E1">   vercel_project_id</text>
  <text x="310" y="240" font-family="monospace" font-size="10" fill="#CBD5E1">   health_url (SSRF validated)</text>
  <text x="310" y="258" font-family="monospace" font-size="10" fill="#CBD5E1">   alert_secret (Encrypted AES)</text>
  <text x="310" y="276" font-family="monospace" font-size="10" fill="#CBD5E1">   default_branch, disabled</text>
  <text x="310" y="294" font-family="monospace" font-size="10" fill="#CBD5E1">   UNIQUE(workspace_id, slug)</text>

  <!-- Table: alerts -->
  <rect x="40" y="445" width="220" height="170" rx="6" fill="#1E293B" stroke="#FB923C"/>
  <rect x="40" y="445" width="220" height="28" rx="6" fill="#FB923C"/>
  <text x="50" y="464" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">alerts (Ingested Payloads)</text>
  <text x="50" y="490" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (alr_...)</text>
  <text x="50" y="508" font-family="monospace" font-size="10" fill="#CBD5E1">FK workspace_id ➔ workspaces</text>
  <text x="50" y="526" font-family="monospace" font-size="10" fill="#CBD5E1">FK service_id ➔ services</text>
  <text x="50" y="544" font-family="monospace" font-size="10" fill="#CBD5E1">FK incident_id ➔ incidents</text>
  <text x="50" y="562" font-family="monospace" font-size="10" fill="#CBD5E1">   fingerprint, severity</text>
  <text x="50" y="580" font-family="monospace" font-size="10" fill="#CBD5E1">   payload (JSONB error frames)</text>
  <text x="50" y="598" font-family="monospace" font-size="10" fill="#CBD5E1">   observed_sha, observed_url</text>

  <!-- Table: incidents -->
  <rect x="580" y="105" width="250" height="235" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1.8"/>
  <rect x="580" y="105" width="250" height="28" rx="6" fill="#EF4444"/>
  <text x="590" y="124" font-family="monospace" font-size="12" font-weight="700" fill="#FFF">incidents (Core Domain Entity)</text>
  <text x="590" y="150" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (inc_...)</text>
  <text x="590" y="168" font-family="monospace" font-size="10" fill="#CBD5E1">FK workspace_id ➔ workspaces</text>
  <text x="590" y="186" font-family="monospace" font-size="10" fill="#CBD5E1">FK service_id ➔ services</text>
  <text x="590" y="204" font-family="monospace" font-size="10" fill="#CBD5E1">   number (AUTO_INC #1, #2, #3)</text>
  <text x="590" y="222" font-family="monospace" font-size="10" fill="#CBD5E1">   status (opened, triaged, mitigating,</text>
  <text x="590" y="238" font-family="monospace" font-size="10" fill="#CBD5E1">           verifying, resolved, dismissed)</text>
  <text x="590" y="256" font-family="monospace" font-size="10" fill="#CBD5E1">   title, severity, fingerprint</text>
  <text x="590" y="274" font-family="monospace" font-size="10" fill="#CBD5E1">   bad_deployment (JSONB ref)</text>
  <text x="590" y="292" font-family="monospace" font-size="10" fill="#CBD5E1">   good_deployment (JSONB ref)</text>
  <text x="590" y="310" font-family="monospace" font-size="10" fill="#CBD5E1">   opened_at, resolved_at</text>
  <text x="590" y="328" font-family="monospace" font-size="10" fill="#CBD5E1">   resolution_note, resolved_by</text>

  <!-- Table: actions -->
  <rect x="860" y="105" width="220" height="245" rx="6" fill="#1E293B" stroke="#6366F1" stroke-width="1.8"/>
  <rect x="860" y="105" width="220" height="28" rx="6" fill="#6366F1"/>
  <text x="870" y="124" font-family="monospace" font-size="12" font-weight="700" fill="#FFF">actions (Rollback Proposals)</text>
  <text x="870" y="150" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (act_...)</text>
  <text x="870" y="168" font-family="monospace" font-size="10" fill="#CBD5E1">FK workspace_id ➔ workspaces</text>
  <text x="870" y="186" font-family="monospace" font-size="10" fill="#CBD5E1">FK incident_id ➔ incidents</text>
  <text x="870" y="204" font-family="monospace" font-size="10" fill="#CBD5E1">FK service_id ➔ services</text>
  <text x="870" y="222" font-family="monospace" font-size="10" fill="#CBD5E1">   type: rollback</text>
  <text x="870" y="240" font-family="monospace" font-size="10" fill="#CBD5E1">   status: awaiting_approval,</text>
  <text x="870" y="256" font-family="monospace" font-size="10" fill="#CBD5E1">           approved, executing,</text>
  <text x="870" y="272" font-family="monospace" font-size="10" fill="#CBD5E1">           verifying, verified, failed</text>
  <text x="870" y="290" font-family="monospace" font-size="10" fill="#CBD5E1">   target_deployment (JSONB)</text>
  <text x="870" y="308" font-family="monospace" font-size="10" fill="#CBD5E1">   preflight (JSONB 6 gates)</text>
  <text x="870" y="326" font-family="monospace" font-size="10" fill="#CBD5E1">   expires_at (TTL 15m)</text>
  <text x="870" y="342" font-family="monospace" font-size="10" fill="#CBD5E1">   vercel_response, error_code</text>

  <!-- Table: suspects -->
  <rect x="300" y="350" width="240" height="150" rx="6" fill="#1E293B" stroke="#F97316"/>
  <rect x="300" y="350" width="240" height="28" rx="6" fill="#F97316"/>
  <text x="310" y="369" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">suspects (Ranked Commits)</text>
  <text x="310" y="395" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (ssp_...)</text>
  <text x="310" y="413" font-family="monospace" font-size="10" fill="#CBD5E1">FK incident_id ➔ incidents</text>
  <text x="310" y="431" font-family="monospace" font-size="10" fill="#CBD5E1">   sha, short_sha, author, message</text>
  <text x="310" y="449" font-family="monospace" font-size="10" fill="#CBD5E1">   points (integer 0..100)</text>
  <text x="310" y="467" font-family="monospace" font-size="10" fill="#CBD5E1">   evidence (JSONB 8 factors)</text>
  <text x="310" y="485" font-family="monospace" font-size="10" fill="#CBD5E1">   files (JSONB diff excerpts)</text>

  <!-- Table: analyses -->
  <rect x="580" y="365" width="250" height="135" rx="6" fill="#1E293B" stroke="#A855F7"/>
  <rect x="580" y="365" width="250" height="28" rx="6" fill="#A855F7"/>
  <text x="590" y="384" font-family="monospace" font-size="12" font-weight="700" fill="#FFF">analyses (AI Explanations)</text>
  <text x="590" y="410" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (ans_...)</text>
  <text x="590" y="428" font-family="monospace" font-size="10" fill="#CBD5E1">FK incident_id ➔ incidents</text>
  <text x="590" y="446" font-family="monospace" font-size="10" fill="#CBD5E1">   provider (google / openai)</text>
  <text x="590" y="464" font-family="monospace" font-size="10" fill="#CBD5E1">   model, prompt_tokens, status</text>
  <text x="590" y="482" font-family="monospace" font-size="10" fill="#CBD5E1">   result (JSONB: cause, fix, conf)</text>

  <!-- Table: probes -->
  <rect x="860" y="375" width="220" height="125" rx="6" fill="#1E293B" stroke="#10B981"/>
  <rect x="860" y="375" width="220" height="28" rx="6" fill="#10B981"/>
  <text x="870" y="394" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">probes (Canary History)</text>
  <text x="870" y="420" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (prb_...)</text>
  <text x="870" y="438" font-family="monospace" font-size="10" fill="#CBD5E1">FK action_id ➔ actions</text>
  <text x="870" y="456" font-family="monospace" font-size="10" fill="#CBD5E1">   seq (1..18), status_code</text>
  <text x="870" y="474" font-family="monospace" font-size="10" fill="#CBD5E1">   streak (0..3), ok (boolean)</text>
  <text x="870" y="492" font-family="monospace" font-size="10" fill="#CBD5E1">   UNIQUE(action_id, seq)</text>

  <!-- Table: timeline_events -->
  <rect x="300" y="520" width="780" height="95" rx="6" fill="#1E293B" stroke="#E2E8F0"/>
  <rect x="300" y="520" width="780" height="26" rx="6" fill="#475569"/>
  <text x="310" y="538" font-family="monospace" font-size="11" font-weight="700" fill="#FFF">timeline_events (Immutable Append-Only Audit Trail)</text>
  <text x="310" y="562" font-family="monospace" font-size="10" fill="#CBD5E1">PK id (evt_...) • FK workspace_id • FK incident_id ➔ incidents • at (timestamp)</text>
  <text x="310" y="580" font-family="monospace" font-size="10" fill="#CBD5E1">actor_type ('user' | 'system' | 'mcp' | 'api') • actor_id • type ('alert_ingested', 'action_proposed', 'action_approved', ...)</text>
  <text x="310" y="598" font-family="monospace" font-size="10" fill="#CBD5E1">summary (human-readable string) • data (JSONB context payload)</text>
</svg>