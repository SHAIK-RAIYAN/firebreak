<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="580" rx="14" fill="url(#bgG)"/>
  <rect x="2" y="2" width="1096" height="576" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">DIAGRAM G: END-TO-END EXECUTION SEQUENCE</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8">Lifecycle from HTTP 500 alert webhook to Vercel promote fallback and probe recovery</text>

  <!-- Actors Header -->
  <line x1="120" y1="120" x2="120" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="50" y="90" width="140" height="30" rx="5" fill="#EF4444"/>
  <text x="65" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF">Alert Webhook</text>

  <line x1="300" y1="120" x2="300" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="230" y="90" width="140" height="30" rx="5" fill="#38BDF8"/>
  <text x="245" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Web API / Inngest</text>

  <line x1="500" y1="120" x2="500" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="430" y="90" width="140" height="30" rx="5" fill="#10B981"/>
  <text x="445" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Core Services</text>

  <line x1="700" y1="120" x2="700" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="630" y="90" width="140" height="30" rx="5" fill="#818CF8"/>
  <text x="645" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF">MCP Server / UI</text>

  <line x1="900" y1="120" x2="900" y2="540" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="830" y="90" width="140" height="30" rx="5" fill="#F59E0B"/>
  <text x="845" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Vercel &amp; GitHub</text>

  <!-- Step 1 -->
  <line x1="120" y1="150" x2="300" y2="150" stroke="#EF4444" stroke-width="2"/>
  <text x="135" y="142" font-family="monospace" font-size="10" fill="#EF4444">1. POST /api/v1/alerts/svc_123 (HMAC signed)</text>

  <!-- Step 2 -->
  <line x1="300" y1="185" x2="500" y2="185" stroke="#38BDF8" stroke-width="2"/>
  <text x="315" y="177" font-family="monospace" font-size="10" fill="#38BDF8">2. Inngest: step.run('triage-pipeline')</text>

  <!-- Step 3 -->
  <line x1="500" y1="220" x2="900" y2="220" stroke="#F59E0B" stroke-width="2"/>
  <text x="515" y="212" font-family="monospace" font-size="10" fill="#F59E0B">3. Compare GitHub commits &amp; fetch Vercel target</text>

  <!-- Step 4 -->
  <line x1="900" y1="255" x2="500" y2="255" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="615" y="247" font-family="monospace" font-size="10" fill="#94A3B8">4. Return commit diffs &amp; last-good deployment</text>

  <!-- Step 5 -->
  <line x1="500" y1="290" x2="700" y2="290" stroke="#10B981" stroke-width="2"/>
  <text x="515" y="282" font-family="monospace" font-size="10" fill="#10B981">5. Propose rollback with 6 Preflight checks passed</text>

  <!-- Step 6 -->
  <line x1="700" y1="335" x2="300" y2="335" stroke="#818CF8" stroke-width="2"/>
  <text x="385" y="327" font-family="monospace" font-size="10" fill="#818CF8">6. Human Approval: 'Hold to Confirm' UI or approve_action</text>

  <!-- Step 7 -->
  <line x1="300" y1="375" x2="900" y2="375" stroke="#F43F5E" stroke-width="2"/>
  <text x="315" y="367" font-family="monospace" font-size="10" fill="#F43F5E">7. POST /v1/rollback ➔ 402 Plan Limit</text>

  <!-- Step 8 -->
  <line x1="300" y1="410" x2="900" y2="410" stroke="#10B981" stroke-width="2"/>
  <text x="315" y="402" font-family="monospace" font-size="10" fill="#10B981">8. Fallback: POST /v10/promote/:id (201 Created)</text>

  <!-- Step 9 -->
  <line x1="900" y1="445" x2="300" y2="445" stroke="#34D399" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="415" y="437" font-family="monospace" font-size="10" fill="#34D399">9. Production alias updated to last-good SHA</text>

  <!-- Step 10 -->
  <line x1="300" y1="485" x2="500" y2="485" stroke="#10B981" stroke-width="2"/>
  <text x="315" y="477" font-family="monospace" font-size="10" fill="#10B981">10. Run health probes 1, 2, 3 ➔ streak &gt;= 3 verified</text>

  <!-- Step 11 -->
  <line x1="500" y1="520" x2="700" y2="520" stroke="#38BDF8" stroke-width="2"/>
  <text x="515" y="512" font-family="monospace" font-size="10" fill="#38BDF8">11. Incident status marked 'resolved' • Audit event written</text>
</svg>