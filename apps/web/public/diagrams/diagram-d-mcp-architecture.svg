<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="560" rx="14" fill="url(#bgD)"/>
  <rect x="2" y="2" width="1096" height="556" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <text x="40" y="48" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">DIAGRAM D: NITROSTACK MCP SERVER ARCHITECTURE</text>
  <text x="40" y="74" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">Universal Dual Transport (STDIO + SSE), Security Guard, 9 Registered Tools, and 3 Interactive UI Widgets</text>

  <!-- Left Column: MCP Hosts & Transports -->
  <rect x="40" y="105" width="240" height="420" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="55" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#A855F7">MCP HOSTS / CLIENTS</text>

  <rect x="55" y="150" width="210" height="70" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="68" y="174" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">NitroStudio (GUI)</text>
  <text x="68" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Visual debugging tool &amp; widget inspector</text>
  <text x="68" y="206" font-family="monospace" font-size="10" fill="#C084FC">Connects via STDIO / SSE</text>

  <rect x="55" y="235" width="210" height="70" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="68" y="259" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Claude Desktop / Cursor</text>
  <text x="68" y="277" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Local developer workflow</text>
  <text x="68" y="291" font-family="monospace" font-size="10" fill="#38BDF8">STDIO process spawn (node dist/index.js)</text>

  <rect x="55" y="320" width="210" height="85" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="68" y="344" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">ChatGPT / NitroCloud</text>
  <text x="68" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Remote cloud invocation</text>
  <text x="68" y="376" font-family="monospace" font-size="10" fill="#34D399">HTTP SSE Endpoint (/mcp)</text>
  <text x="68" y="390" font-family="monospace" font-size="10" fill="#FB923C">Bearer fbk_... API Key Auth</text>

  <!-- Middle Column: NitroStack Core Framework Engine -->
  <rect x="310" y="105" width="440" height="420" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="325" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#818CF8">NITROSTACK ENGINE (@nitrostack/core)</text>

  <rect x="325" y="150" width="410" height="55" rx="6" fill="#0F172A" stroke="#475569"/>
  <text x="340" y="172" font-family="monospace" font-size="12" font-weight="700" fill="#E2E8F0">McpApplicationFactory.create(AppModule)</text>
  <text x="340" y="190" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">NestJS-style modular DI container, request lifecycle, and schema validation</text>

  <rect x="325" y="215" width="410" height="65" rx="6" fill="#0F172A" stroke="#EF4444"/>
  <text x="340" y="237" font-family="monospace" font-size="12" font-weight="700" fill="#F87171">@UseGuards(McpKeyGuard)</text>
  <text x="340" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Extracts Bearer token or fbk_ key • SHA-256 hash lookup in mcp_api_keys table</text>
  <text x="340" y="269" font-family="monospace" font-size="10" fill="#CBD5E1">Enforces scopes: incidents:read, actions:propose, actions:approve</text>

  <!-- 9 Tools List -->
  <rect x="325" y="290" width="200" height="215" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="338" y="312" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">Registered Tools (9)</text>
  <text x="338" y="332" font-family="monospace" font-size="10" fill="#CBD5E1">1. list_services</text>
  <text x="338" y="350" font-family="monospace" font-size="10" fill="#CBD5E1">2. list_incidents</text>
  <text x="338" y="368" font-family="monospace" font-size="10" fill="#CBD5E1">3. get_incident</text>
  <text x="338" y="386" font-family="monospace" font-size="10" fill="#CBD5E1">4. get_suspects</text>
  <text x="338" y="404" font-family="monospace" font-size="10" fill="#CBD5E1">5. get_analysis</text>
  <text x="338" y="422" font-family="monospace" font-size="10" fill="#CBD5E1">6. get_timeline</text>
  <text x="338" y="440" font-family="monospace" font-size="10" fill="#CBD5E1">7. propose_rollback</text>
  <text x="338" y="458" font-family="monospace" font-size="10" fill="#CBD5E1">8. get_action_status</text>
  <text x="338" y="476" font-family="monospace" font-size="10" fill="#CBD5E1">9. approve_action</text>

  <!-- Rate Limiter & Shared -->
  <rect x="535" y="290" width="200" height="215" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="548" y="312" font-family="monospace" font-size="11" font-weight="700" fill="#F59E0B">Execution Safety</text>
  <text x="548" y="334" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• @RateLimit({ requests: 60, window: '1m' })</text>
  <text x="548" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Zod input schema validation on all payloads</text>
  <text x="548" y="396" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Annotations: readOnlyHint, destructiveHint</text>
  <text x="548" y="427" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Universal coreCtx injection into shared services</text>
  <text x="548" y="458" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Structured Error mapper (AppError ➔ MCP text)</text>

  <!-- Right Column: Interactive Widgets -->
  <rect x="780" y="105" width="280" height="420" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="795" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10B981">MCP WIDGETS (React Bundles)</text>

  <rect x="795" y="150" width="250" height="105" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="808" y="174" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">/incident-card</text>
  <text x="808" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Tied to: get_incident tool</text>
  <text x="808" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Displays: Status badge, good vs bad SHA, top culprit commit, action button</text>
  <text x="808" y="230" font-family="monospace" font-size="10" fill="#64748B">Rendered in NitroStudio right panel</text>

  <rect x="795" y="265" width="250" height="115" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="808" y="289" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A855F7">/suspect-list</text>
  <text x="808" y="309" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Tied to: get_suspects tool</text>
  <text x="808" y="327" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Displays: Ranked culprit commits, score badges, evidence tokens, diff files</text>
  <text x="808" y="345" font-family="monospace" font-size="10" fill="#64748B">Rendered in NitroStudio right panel</text>

  <rect x="795" y="390" width="250" height="115" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="808" y="414" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F59E0B">/action-status</text>
  <text x="808" y="434" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Tied to: propose &amp; approve tools</text>
  <text x="808" y="452" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">• Displays: Rollback Step Rail, 6 Preflight check marks, Canary Probe Strip</text>
  <text x="808" y="470" font-family="monospace" font-size="10" fill="#64748B">Rendered in NitroStudio right panel</text>
</svg>